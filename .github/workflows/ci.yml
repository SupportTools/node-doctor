name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

env:
  GO_VERSION: '1.25'
  REGISTRY: docker.io/supporttools
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Lint job - runs golangci-lint
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8

      - name: Run golangci-lint
        run: golangci-lint run --timeout=5m

  # Helm chart job - guards the generated-vs-template trap and lints the chart.
  #
  # release.yml deletes helm/node-doctor/{Chart,values}.yaml and re-renders them from
  # the *.template files before packaging, so hand-edits to the committed copies never
  # reach the published chart. That silently swallowed an overlay-test CPU-limit fix for
  # six months (it was committed to values.yaml, not values.yaml.template). This job
  # fails the build whenever the two diverge.
  helm-chart:
    name: Helm Chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Verify Chart.yaml/values.yaml match their templates
        run: make helm-verify-generated

      - name: Lint chart
        run: helm lint ./helm/node-doctor

  # Test job - runs unit and integration tests
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run unit tests
        run: go test ./pkg/... ./cmd/... -v -race -covermode=atomic -coverprofile=coverage.out -short

      - name: Run integration tests
        run: |
          if [ -d "test/integration" ]; then
            go test ./test/integration/... -v -race -covermode=atomic -coverprofile=coverage-integration.out
          else
            echo "Integration tests not yet implemented - skipping"
          fi

      - name: Generate coverage report
        run: |
          go tool cover -func=coverage.out | grep total | awk '{print "Unit test coverage: " $3}'
          if [ -f coverage-integration.out ]; then
            go tool cover -func=coverage-integration.out | grep total | awk '{print "Integration test coverage: " $3}'
          fi

      - name: Check coverage threshold
        run: |
          if [ ! -f coverage.out ]; then
            echo "::error::Coverage file not found"
            exit 1
          fi

          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')

          if [ -z "$COVERAGE" ]; then
            echo "::error::Failed to extract coverage percentage"
            exit 1
          fi

          THRESHOLD=70
          echo "Current coverage: ${COVERAGE}%"
          echo "Minimum threshold: ${THRESHOLD}%"

          if (( $(echo "$COVERAGE < $THRESHOLD" | bc -l) )); then
            echo "::error::Coverage ${COVERAGE}% is below minimum threshold of ${THRESHOLD}%"
            exit 1
          fi
          echo "Coverage check passed!"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        continue-on-error: true  # Codecov is informational; inline check above is the hard gate
        with:
          files: ./coverage.out,./coverage-integration.out
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # Pinger ICMP integration - runs the real raw-ICMP loopback test under privilege.
  #
  # Kept as a SEPARATE job (not a step in `test`) so a privileged-socket flake on
  # the runner does not block the main unit-test/coverage job. The runner user
  # compiles the test binary (preserving the Go env / cache), then runs ONLY the
  # integration test via sudo so it has CAP_NET_RAW. NODE_DOCTOR_ICMP_INTEGRATION=1
  # makes socket/permission errors HARD failures so a misconfigured runner surfaces
  # loudly instead of silently passing without exercising real ICMP.
  pinger-icmp-integration:
    name: Pinger ICMP Integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Compile network test binary
        run: go test -c -o /tmp/nd-network.test ./pkg/monitors/network/

      - name: Run ICMP integration test (privileged)
        run: |
          sudo NODE_DOCTOR_ICMP_INTEGRATION=1 /tmp/nd-network.test \
            -test.run '^TestDefaultPinger_Integration$' -test.v

  # Security scan - gosec
  security-gosec:
    name: Security Scan (gosec)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run gosec
        uses: securego/gosec@v2.25.0
        with:
          args: '-no-fail -fmt sarif -out gosec-results.sarif ./...'

      - name: Upload gosec results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        continue-on-error: true  # gosec SARIF format may have compatibility issues
        with:
          sarif_file: gosec-results.sarif

  # Build job - builds the binary
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Build binary
        run: |
          VERSION=$(date +%s)
          GIT_COMMIT=$(git rev-parse HEAD)
          BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          mkdir -p bin
          cd cmd/node-doctor
          go build \
            -ldflags="-X main.Version=${VERSION} -X main.GitCommit=${GIT_COMMIT} -X main.BuildTime=${BUILD_TIME}" \
            -o ../../bin/node-doctor

      - name: Build overlay-test-server binary
        run: |
          mkdir -p bin
          cd cmd/overlay-test-server
          go build -o ../../bin/overlay-test-server

      - name: Test binary
        run: ./bin/node-doctor --version

      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: node-doctor-binary
          path: bin/node-doctor
          retention-days: 7

  # Docker image build - VALIDATION ONLY, never pushes.
  #
  # This job used to be gated on `startsWith(github.ref, 'refs/tags/v')` and pushed both
  # ${TAG} and, unconditionally, `latest` — linux/amd64 only. release.yml pushes the same
  # repository (docker.io/supporttools/node-doctor) on the same tag event, multi-arch, and
  # deliberately withholds `latest` from rc/beta/alpha tags. With no ordering between the
  # two workflows, whichever finished last won `:latest`, so `:latest` could silently become
  # amd64-only (the fleet has arm64 nodes -> exec format error), and an -rc tag could move
  # `:latest` anyway, defeating release.yml's exclusion.
  #
  # release.yml is now the SOLE publisher of container images. This job keeps the Dockerfile
  # under test on every PR/branch push (earlier than before, when it only built on tags) but
  # builds with push:false so it can never race for a tag. The grype scan that used to live
  # here needs a *published* image and therefore moved to release.yml.
  docker:
    name: Docker Build (no push)
    runs-on: ubuntu-latest
    needs: [lint, test, build, security-gosec]
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Authenticated base-image pulls avoid anonymous Docker Hub rate limits.
      # Skipped for fork PRs, which have no access to secrets; the build still works
      # anonymously there.
      - name: Log in to Docker Hub (base image pulls)
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build metadata
        id: meta
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          # Validation build only - this VERSION never reaches a published image.
          {
            echo "VERSION=ci-$(printf '%s' "$REF_NAME" | tr -cd 'A-Za-z0-9._-')"
            echo "GIT_COMMIT=$(git rev-parse HEAD)"
            echo "BUILD_TIME=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } >> "$GITHUB_OUTPUT"

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          tags: ${{ env.REGISTRY }}/node-doctor:ci-${{ github.sha }}
          build-args: |
            VERSION=${{ steps.meta.outputs.VERSION }}
            GIT_COMMIT=${{ steps.meta.outputs.GIT_COMMIT }}
            BUILD_TIME=${{ steps.meta.outputs.BUILD_TIME }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Summary job - provides overall status
  #
  # New gating jobs are wired in here rather than added as new required status checks:
  # a brand-new required context leaves every already-open PR stuck on
  # "Expected — waiting for status". `CI Success` is already required, so extending its
  # `needs:` gates the new job without touching branch protection.
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [lint, test, build, security-gosec, helm-chart, docker]
    if: always()
    steps:
      - name: Check job results
        run: |
          if [[ "${{ needs.lint.result }}" != "success" ]] || \
             [[ "${{ needs.test.result }}" != "success" ]] || \
             [[ "${{ needs.build.result }}" != "success" ]] || \
             [[ "${{ needs.security-gosec.result }}" != "success" ]] || \
             [[ "${{ needs.helm-chart.result }}" != "success" ]] || \
             [[ "${{ needs.docker.result }}" != "success" ]]; then
            echo "One or more CI jobs failed"
            exit 1
          fi
          echo "All CI jobs passed successfully!"
