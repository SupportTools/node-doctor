apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "node-doctor.configMapName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "node-doctor.labels" . | nindent 4 }}
data:
  config.yaml: |
    apiVersion: v1
    kind: NodeDoctorConfig
    metadata:
      name: {{ include "node-doctor.name" . }}
    settings:
      nodeName: "${NODE_NAME}"
      logLevel: {{ .Values.settings.logLevel }}
      logFormat: {{ .Values.settings.logFormat }}
      logOutput: stdout
      updateInterval: {{ .Values.settings.updateInterval }}
      resyncInterval: {{ .Values.settings.resyncInterval }}
      heartbeatInterval: {{ .Values.settings.heartbeatInterval }}
      dryRunMode: {{ .Values.settings.dryRunMode }}
      qps: {{ .Values.settings.qps }}
      burst: {{ .Values.settings.burst }}

    monitors:
      {{- if .Values.monitors.cpu.enabled }}
      # CPU Monitor - Load average and thermal monitoring
      - name: cpu-health
        type: system-cpu
        enabled: true
        interval: {{ .Values.monitors.cpu.interval }}
        timeout: {{ .Values.monitors.cpu.timeout }}
        config:
          warningLoadFactor: {{ .Values.monitors.cpu.warningLoadFactor }}
          criticalLoadFactor: {{ .Values.monitors.cpu.criticalLoadFactor }}
          checkThermalThrottle: {{ .Values.monitors.cpu.checkThermalThrottle }}
      {{- end }}

      {{- if .Values.monitors.memory.enabled }}
      # Memory Monitor - Memory and swap usage monitoring
      - name: memory-health
        type: system-memory
        enabled: true
        interval: {{ .Values.monitors.memory.interval }}
        timeout: {{ .Values.monitors.memory.timeout }}
        config:
          warningThreshold: {{ .Values.monitors.memory.warningThreshold }}
          criticalThreshold: {{ .Values.monitors.memory.criticalThreshold }}
          swapWarningThreshold: {{ .Values.monitors.memory.swapWarningThreshold }}
          swapCriticalThreshold: {{ .Values.monitors.memory.swapCriticalThreshold }}
          checkOOMKills: {{ .Values.monitors.memory.checkOOMKills }}
          kmsgPath: /dev/kmsg
      {{- end }}

      {{- if .Values.monitors.disk.enabled }}
      # Disk Monitor - Disk space and I/O health
      - name: disk-health
        type: system-disk
        enabled: true
        interval: {{ .Values.monitors.disk.interval }}
        timeout: {{ .Values.monitors.disk.timeout }}
        config:
          mountPoints:
            {{- toYaml .Values.monitors.disk.mountPoints | nindent 12 }}
          checkReadonly: {{ .Values.monitors.disk.checkReadonly }}
          checkIOHealth: {{ .Values.monitors.disk.checkIOHealth }}
      {{- end }}

      {{- if .Values.monitors.ipForwarding.enabled }}
      # IP Forwarding Monitor - Detects disabled ip_forward
      - name: ip-forwarding-check
        type: network-ip-forwarding
        enabled: true
        interval: {{ .Values.monitors.ipForwarding.interval }}
        timeout: {{ .Values.monitors.ipForwarding.timeout }}
        config:
          checkIPv4: {{ .Values.monitors.ipForwarding.checkIPv4 }}
          checkIPv6: {{ .Values.monitors.ipForwarding.checkIPv6 }}
          checkPerInterface: {{ .Values.monitors.ipForwarding.checkPerInterface }}
          procPath: /host/proc
      {{- end }}

      {{- if .Values.monitors.ipv6Sysctl.enabled }}
      # IPv6 sysctl Monitor — detection-only, degrades gracefully on IPv4-only nodes
      - name: ipv6-sysctl-check
        type: network-ipv6-sysctl
        enabled: true
        interval: {{ .Values.monitors.ipv6Sysctl.interval }}
        timeout: {{ .Values.monitors.ipv6Sysctl.timeout }}
        config:
          expectIPv6Enabled: {{ .Values.monitors.ipv6Sysctl.expectIPv6Enabled }}
          checkPerInterface: {{ .Values.monitors.ipv6Sysctl.checkPerInterface }}
          procPath: {{ .Values.monitors.ipv6Sysctl.procPath }}
      {{- end }}

      {{- if .Values.monitors.ipv6Route.enabled }}
      # IPv6 Route Monitor — detection-only, degrades gracefully on IPv4-only nodes
      - name: ipv6-route-check
        type: network-ipv6-route
        enabled: true
        interval: {{ .Values.monitors.ipv6Route.interval }}
        timeout: {{ .Values.monitors.ipv6Route.timeout }}
        config:
          expectDefaultRoute: {{ .Values.monitors.ipv6Route.expectDefaultRoute }}
          procPath: {{ .Values.monitors.ipv6Route.procPath }}
      {{- end }}

      {{- if .Values.monitors.ipv6Neighbor.enabled }}
      # IPv6 Neighbor Monitor — detection-only, degrades gracefully on IPv4-only nodes
      - name: ipv6-neighbor-check
        type: network-ipv6-neighbor
        enabled: true
        interval: {{ .Values.monitors.ipv6Neighbor.interval }}
        timeout: {{ .Values.monitors.ipv6Neighbor.timeout }}
        config:
          expectIPv6Enabled: {{ .Values.monitors.ipv6Neighbor.expectIPv6Enabled }}
          checkPerInterface: {{ .Values.monitors.ipv6Neighbor.checkPerInterface }}
          requireGlobalAddress: {{ .Values.monitors.ipv6Neighbor.requireGlobalAddress }}
          procPath: {{ .Values.monitors.ipv6Neighbor.procPath }}
      {{- end }}

      {{- if .Values.monitors.ipv6Firewall.enabled }}
      # IPv6 Firewall Monitor — detection-only, degrades gracefully on IPv4-only nodes
      - name: ipv6-firewall-check
        type: network-ipv6-firewall
        enabled: true
        interval: {{ .Values.monitors.ipv6Firewall.interval }}
        timeout: {{ .Values.monitors.ipv6Firewall.timeout }}
        config:
          expectIPv6Enabled: {{ .Values.monitors.ipv6Firewall.expectIPv6Enabled }}
          backend: {{ .Values.monitors.ipv6Firewall.backend }}
      {{- end }}

      {{- if .Values.overlayTest.enabled }}
      # CNI Connectivity Monitor - Tests overlay network connectivity
      # Uses overlay-test pods for accurate CNI testing
      - name: cni-connectivity
        type: network-cni-check
        enabled: true
        interval: 30s
        timeout: 15s
        config:
          discovery:
            method: kubernetes
            namespace: {{ .Release.Namespace }}
            labelSelector: app={{ include "node-doctor.name" . }}-overlay-test
            refreshInterval: 5m
            overlayTestEnabled: true
            overlayTestLabelSelector: app={{ include "node-doctor.name" . }}-overlay-test
          connectivity:
            probeMethod: http
            probePort: {{ .Values.overlayTest.port | default 8023 }}
            probePath: /healthz
            pingCount: 3
            pingTimeout: 5s
            warningLatency: 200ms
            criticalLatency: 500ms
            failureThreshold: 3
            minReachablePeers: 80
          cniHealth:
            enabled: true
            # Use /host prefix since host filesystem is mounted at /host in container
            configPath: /host/etc/cni/net.d
            checkInterfaces: true
      {{- end }}

      # DNS Health Monitor — cluster-domain check DISABLED (clusterDomains: []).
      # node-doctor runs hostNetwork; from the host netns the kube-dns ClusterIP does
      # NOT resolve cluster records (Cilium host-netns->ClusterIP), so ANY cluster
      # domain (cluster.local OR a custom cluster-domain) NXDOMAINs even though pods
      # resolve fine — a structural false positive that spammed ClusterDNSResolutionFailed
      # fleet-wide and got a version rolled back (cluster-services #19529). Without this
      # explicit entry, ApplyDefaultMonitors adds a dns-health with the cluster.local
      # default and the false positives return. External-domain resolution DOES work from
      # hostNetwork and is retained as the node DNS signal.
      - name: dns-health
        type: network-dns-check
        enabled: true
        interval: 30s
        timeout: 10s
        config:
          clusterDomains: []
          externalDomains:
            - google.com
            - cloudflare.com
          latencyThreshold: 1s
          nameserverCheckEnabled: true
          failureCountThreshold: 3
      {{- if .Values.clusterDnsPodProbe.enabled }}

      # Cluster DNS via pod-network (overlay-test pods). node-doctor runs hostNetwork,
      # from which the kube-dns ClusterIP does NOT resolve CLUSTER records (Cilium
      # host-netns->ClusterIP), so the in-agent cluster-DNS check above stays disabled
      # (clusterDomains: []). This monitor instead queries the overlay-test pods'
      # /clusterdns endpoint — they run in pod-network and DO resolve cluster records —
      # and drives ClusterDNSDown from that pod-sourced truth. Requires an overlay-test
      # image that serves /clusterdns (v1.8.3+); enabling it against an older overlay-test
      # image makes every probe 404 and falsely reports ClusterDNSDown.
      - name: cluster-dns-pod
        type: network-cluster-dns-pod
        enabled: true
        interval: {{ .Values.clusterDnsPodProbe.interval }}
        timeout: {{ .Values.clusterDnsPodProbe.timeout }}
        config:
          labelSelector: {{ .Values.clusterDnsPodProbe.labelSelector | quote }}
          namespace: {{ .Release.Namespace }}
          probePort: {{ .Values.clusterDnsPodProbe.probePort }}
          probePath: {{ .Values.clusterDnsPodProbe.probePath | quote }}
          minSuccessPods: {{ .Values.clusterDnsPodProbe.minSuccessPods }}
          failureCountThreshold: {{ .Values.clusterDnsPodProbe.failureCountThreshold }}
      {{- end }}

      {{- if .Values.monitors.kubelet.enabled }}
      # Kubelet Health Monitor
      - name: kubelet-health
        type: kubernetes-kubelet-check
        enabled: true
        interval: {{ .Values.monitors.kubelet.interval }}
        timeout: {{ .Values.monitors.kubelet.timeout }}
        config:
          healthzURL: {{ .Values.monitors.kubelet.healthzURL | quote }}
          checkSystemdStatus: {{ .Values.monitors.kubelet.checkSystemdStatus }}
          checkPLEG: {{ .Values.monitors.kubelet.checkPLEG }}
          failureThreshold: {{ .Values.monitors.kubelet.failureThreshold }}
      {{- end }}

      {{- if .Values.monitors.apiserver.enabled }}
      # API Server Health Monitor
      - name: apiserver-health
        type: kubernetes-apiserver-check
        enabled: true
        interval: {{ .Values.monitors.apiserver.interval }}
        timeout: {{ .Values.monitors.apiserver.timeout }}
        config:
          latencyThreshold: {{ .Values.monitors.apiserver.latencyThreshold }}
          httpTimeout: {{ .Values.monitors.apiserver.httpTimeout }}
          failureThreshold: {{ .Values.monitors.apiserver.failureThreshold }}
          checkVersion: {{ .Values.monitors.apiserver.checkVersion }}
          checkAuth: {{ .Values.monitors.apiserver.checkAuth }}
      {{- end }}

      {{- if .Values.monitors.runtime.enabled }}
      # Container Runtime Health Monitor
      - name: runtime-health
        type: kubernetes-runtime-check
        enabled: true
        interval: {{ .Values.monitors.runtime.interval }}
        timeout: {{ .Values.monitors.runtime.timeout }}
        config:
          runtimeType: {{ .Values.monitors.runtime.runtimeType }}
          checkSocketConnectivity: {{ .Values.monitors.runtime.checkSocketConnectivity }}
          checkSystemdStatus: {{ .Values.monitors.runtime.checkSystemdStatus }}
          checkRuntimeInfo: {{ .Values.monitors.runtime.checkRuntimeInfo }}
          failureThreshold: {{ .Values.monitors.runtime.failureThreshold }}
      {{- end }}

      {{- if .Values.monitors.capacity.enabled }}
      # Pod Capacity Monitor
      - name: capacity-health
        type: kubernetes-capacity-check
        enabled: true
        interval: {{ .Values.monitors.capacity.interval }}
        timeout: {{ .Values.monitors.capacity.timeout }}
        config:
          warningThreshold: {{ .Values.monitors.capacity.warningThreshold }}
          criticalThreshold: {{ .Values.monitors.capacity.criticalThreshold }}
          checkAllocatable: {{ .Values.monitors.capacity.checkAllocatable }}
          apiTimeout: {{ .Values.monitors.capacity.apiTimeout }}
          failureThreshold: {{ .Values.monitors.capacity.failureThreshold }}
      {{- end }}

      {{- if .Values.monitors.gateway.enabled }}
      # Default Gateway Monitor
      - name: gateway-health
        type: network-gateway-check
        enabled: true
        interval: {{ .Values.monitors.gateway.interval }}
        timeout: {{ .Values.monitors.gateway.timeout }}
        config:
          pingCount: {{ .Values.monitors.gateway.pingCount }}
          pingTimeout: {{ .Values.monitors.gateway.pingTimeout }}
          latencyThreshold: {{ .Values.monitors.gateway.latencyThreshold }}
          autoDetectGateway: {{ .Values.monitors.gateway.autoDetectGateway }}
          failureCountThreshold: {{ .Values.monitors.gateway.failureCountThreshold }}
          addressFamily: {{ .Values.monitors.gateway.addressFamily }}
      {{- end }}

      {{- if .Values.monitors.connectivity.enabled }}
      # External Connectivity Monitor
      - name: connectivity-health
        type: network-connectivity-check
        enabled: true
        interval: {{ .Values.monitors.connectivity.interval }}
        timeout: {{ .Values.monitors.connectivity.timeout }}
        config:
          failureThreshold: {{ .Values.monitors.connectivity.failureThreshold }}
          endpoints:
            {{- toYaml .Values.monitors.connectivity.endpoints | nindent 12 }}
      {{- end }}

    exporters:
      kubernetes:
        enabled: {{ .Values.exporters.kubernetes.enabled }}
        updateInterval: {{ .Values.exporters.kubernetes.updateInterval }}
        resyncInterval: {{ .Values.exporters.kubernetes.resyncInterval }}
        heartbeatInterval: {{ .Values.exporters.kubernetes.heartbeatInterval }}
        namespace: {{ .Release.Namespace }}
        conditions:
          - type: NodeDoctorHealthy
            defaultStatus: "True"
            defaultReason: "NodeDoctorRunning"
            defaultMessage: "Node Doctor is running and monitoring the node"
        events:
          maxEventsPerMinute: {{ .Values.exporters.kubernetes.maxEventsPerMinute }}
          eventTTL: {{ .Values.exporters.kubernetes.eventTTL }}
          deduplicationWindow: {{ .Values.exporters.kubernetes.deduplicationWindow }}

      http:
        enabled: {{ or .Values.exporters.http.enabled .Values.controller.enabled }}
        {{- if .Values.controller.enabled }}
        webhooks:
          - name: controller
            url: {{ printf "%s/api/v1/reports" (include "node-doctor.controller.serviceURL" .) | quote }}
            interval: 30s
            timeout: 10s
        {{- end }}

      prometheus:
        enabled: {{ .Values.exporters.prometheus.enabled }}
        port: {{ .Values.exporters.prometheus.port }}
        path: {{ .Values.exporters.prometheus.path }}
        namespace: {{ .Values.exporters.prometheus.namespace }}
        subsystem: {{ .Values.exporters.prometheus.subsystem }}
        labels:
          cluster: kubernetes

    remediation:
      enabled: {{ .Values.remediation.enabled }}
      dryRun: {{ .Values.remediation.dryRun }}
      maxRemediationsPerHour: {{ .Values.remediation.maxRemediationsPerHour }}
      maxRemediationsPerMinute: {{ .Values.remediation.maxRemediationsPerMinute }}
      cooldownPeriod: {{ .Values.remediation.cooldownPeriod }}
      maxAttemptsGlobal: {{ .Values.remediation.maxAttemptsGlobal }}
      {{- if .Values.controller.enabled }}
      coordination:
        enabled: true
        controllerURL: {{ include "node-doctor.controller.serviceURL" . | quote }}
        leaseTimeout: {{ .Values.controller.config.coordination.defaultLeaseDuration }}
        fallbackOnUnreachable: {{ .Values.controller.config.coordination.fallbackOnUnreachable }}
      {{- end }}

    features:
      enableMetrics: {{ .Values.features.enableMetrics }}
      enableProfiling: {{ .Values.features.enableProfiling }}
      enableTracing: {{ .Values.features.enableTracing }}

    # Configuration hot reload. When enabled, edits to this ConfigMap are picked
    # up by the running agent and affected monitors are re-initialized in place;
    # the agent logs which ones. Changes that cannot be hot-applied are reported
    # as a ConfigReloadRestartRequired event instead of silently doing nothing.
    reload:
      enabled: {{ .Values.reload.enabled }}
      debounceInterval: {{ .Values.reload.debounceInterval }}
