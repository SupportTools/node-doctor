# Default values for node-doctor Helm chart
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Node Doctor settings
settings:
  # Log level: debug, info, warn, error
  logLevel: info
  # Log format: json, text
  logFormat: json
  # Update interval for monitors
  updateInterval: 30s
  # Resync interval
  resyncInterval: 5m
  # Heartbeat interval
  heartbeatInterval: 1m
  # Enable remediation actions
  enableRemediation: true
  # Dry run mode (log actions without executing)
  dryRunMode: false
  # Kubernetes API QPS
  qps: 50
  # Kubernetes API burst
  burst: 100

# Container image configuration
image:
  # Image repository
  repository: supporttools/node-doctor
  # Image pull policy
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion
  # This is dynamically set by CI/CD
  tag: "v1.0.0"

# Secrets for pulling images from private registries
imagePullSecrets: []

# Override chart name
nameOverride: ""

# Override full release name
fullnameOverride: ""

# Service account configuration
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use
  # If not set and create is true, a name is generated using the fullname template
  name: "node-doctor"

# Additional pod annotations
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "9101"
  prometheus.io/path: "/metrics"

# Pod labels
podLabels: {}

# Security context for the pod
podSecurityContext:
  runAsUser: 0
  runAsGroup: 0
  fsGroup: 0
  # Supplemental groups for container runtime socket access
  supplementalGroups: [0, 997, 998, 999]

# Container security context - PRIVILEGED ACCESS REQUIRED
securityContext:
  privileged: true
  capabilities:
    add:
      - SYS_ADMIN
      - SYS_PTRACE
      - NET_ADMIN
      - SYS_TIME
      - SETUID
      - SETGID
  allowPrivilegeEscalation: true
  runAsUser: 0
  runAsGroup: 0
  runAsNonRoot: false
  readOnlyRootFilesystem: false

# Host network access - REQUIRED for network monitoring
hostNetwork: true

# Host PID access - REQUIRED for process monitoring
hostPID: true

# DNS policy for host network mode
dnsPolicy: ClusterFirstWithHostNet

# Priority class - ensures highest priority scheduling
priorityClassName: system-node-critical

# Service configuration for metrics endpoint
service:
  type: ClusterIP
  # Use headless service for DaemonSet
  clusterIP: None
  httpPort: 8080
  metricsPort: 9101
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9101"
    prometheus.io/path: "/metrics"

# Prometheus ServiceMonitor configuration (for Prometheus Operator)
serviceMonitor:
  # Enable ServiceMonitor creation
  enabled: false
  # Namespace where ServiceMonitor will be created (defaults to release namespace)
  namespace: ""
  # Additional labels for ServiceMonitor
  labels: {}
  # Scrape interval
  interval: 30s
  # Scrape timeout
  scrapeTimeout: 10s
  # Target port
  port: metrics
  # Path
  path: /metrics
  # Honor labels
  honorLabels: true
  # Metric relabelings
  metricRelabelings: []
  # Relabelings
  relabelings: []

# Prometheus PrometheusRule configuration (for Prometheus Operator alerting)
prometheusRule:
  # Enable PrometheusRule creation
  enabled: false
  # Namespace where PrometheusRule will be created (defaults to release namespace)
  namespace: ""
  # Additional labels for PrometheusRule (e.g., for Prometheus Operator discovery)
  labels: {}
  # Additional custom rules to add
  additionalRules: []

  # Critical alerts - require immediate attention
  critical:
    enabled: true
    cniConfigInvalid:
      for: 5m
      labels: {}
      annotations: {}
    cniUnhealthy:
      for: 5m
      labels: {}
      annotations: {}
    networkPartitioned:
      for: 2m
      labels: {}
      annotations: {}
    kubeletUnhealthy:
      for: 5m
      labels: {}
      annotations: {}
    readOnlyFilesystem:
      for: 1m
      labels: {}
      annotations: {}
    ipForwardingDisabled:
      for: 2m
      labels: {}
      annotations: {}

  # Warning alerts - should be investigated soon
  warning:
    enabled: true
    dnsResolutionFailed:
      for: 5m
    dnsLatencyHigh:
      for: 10m
    memoryPressure:
      for: 10m
    diskPressure:
      for: 10m
    networkDegraded:
      for: 10m
    highPeerLatency:
      for: 10m
      thresholdMs: 100
    lowPeerConnectivity:
      for: 5m
      thresholdPercent: 90
    apiServerLatencyHigh:
      for: 10m
    # Consolidated IPv6 alert (fires on any condition_type=~"IPv6.*").
    # Disabled by default: on mixed IPv4/dual-stack fleets the IPv6 monitors
    # raise benign warnings on IPv4-only nodes, which would page here. Opt in
    # (enabled: true) once IPv6 condition semantics are validated for your fleet.
    # NOTE: this key MUST exist even when disabled — templates/prometheusrule.yaml
    # references .ipv6Misconfigured.enabled/.for/.labels/.annotations, and a missing
    # block makes `helm upgrade` nil-pointer whenever prometheusRule.enabled=true.
    ipv6Misconfigured:
      enabled: false
      for: 10m
      labels: {}
      annotations: {}

  # Informational alerts - for awareness
  info:
    enabled: true
    highEventRate:
      for: 5m
      threshold: 10
    noMetrics:
      for: 10m

# Cluster DNS via pod-network probe (task 242).
# DISABLED by default. node-doctor runs hostNetwork and cannot resolve cluster DNS
# ClusterIP records (Cilium host-netns->ClusterIP), so the in-agent cluster-DNS check
# is off (dns-health clusterDomains: []). When enabled, this adds a monitor that queries
# the overlay-test pods' /clusterdns endpoint (pod-network, which DOES resolve cluster
# records) and drives ClusterDNSDown from that.
# PREREQUISITE: the overlay-test image must serve /clusterdns (v1.8.3+). Enabling this
# against an older overlay-test image makes every probe 404 -> false ClusterDNSDown.
clusterDnsPodProbe:
  enabled: false
  interval: 30s
  timeout: 5s
  labelSelector: "app=node-doctor-overlay-test"
  probePort: 8023
  probePath: "/clusterdns"
  # Number of overlay-test pods that must resolve cluster DNS for it to be healthy.
  minSuccessPods: 1
  # Consecutive failed cycles before ClusterDNSDown latches True.
  failureCountThreshold: 3

# Health probe configuration.
# Probes default to `exec` running the binary's built-in health check, which talks
# to a per-pod unix socket (/var/run/node-doctor/health.sock) instead of TCP :8080.
# Because node-doctor runs with hostNetwork:true, a foreign host process (e.g. an
# IP-float/VIP daemon on hostPort 8080) can answer an httpGet probe with a 404 and
# crashloop the pod; the unix socket lives in the pod and cannot collide.
# To revert to HTTP probes, replace the `exec:` block with `httpGet: {path, port}`.
probes:
  liveness:
    enabled: true
    exec:
      command: ["/usr/local/bin/node-doctor", "-healthcheck"]
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
    successThreshold: 1
  readiness:
    enabled: true
    exec:
      command: ["/usr/local/bin/node-doctor", "-healthcheck-ready"]
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
    successThreshold: 1
  startup:
    enabled: true
    exec:
      command: ["/usr/local/bin/node-doctor", "-healthcheck"]
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 20
    successThreshold: 1

# Resource limits and requests
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 200m
    memory: 256Mi

# Node selector - run on all Linux nodes
nodeSelector:
  kubernetes.io/os: linux

# Tolerations - CRITICAL: Must run on ALL nodes regardless of taints
tolerations:
  # Tolerate all taints - ensures deployment on every node
  - operator: Exists
  # Specific tolerations for common node taints
  - key: node-role.kubernetes.io/master
    operator: Exists
    effect: NoSchedule
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule
  - key: node.kubernetes.io/not-ready
    operator: Exists
    effect: NoExecute
    tolerationSeconds: 300
  - key: node.kubernetes.io/unreachable
    operator: Exists
    effect: NoExecute
    tolerationSeconds: 300
  - key: node.kubernetes.io/disk-pressure
    operator: Exists
    effect: NoSchedule
  - key: node.kubernetes.io/memory-pressure
    operator: Exists
    effect: NoSchedule
  - key: node.kubernetes.io/pid-pressure
    operator: Exists
    effect: NoSchedule
  - key: node.kubernetes.io/network-unavailable
    operator: Exists
    effect: NoSchedule
  - key: CriticalAddonsOnly
    operator: Exists

# Affinity rules
affinity: {}

# Update strategy for the DaemonSet
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 1

# Termination grace period
terminationGracePeriodSeconds: 30

# Monitors configuration
monitors:
  cpu:
    enabled: true
    interval: 30s
    timeout: 10s
    loadAverageThresholds:
      warning: 80
      critical: 95
    thermalThresholds:
      warning: 85
      critical: 95
    cpuUsageThresholds:
      warning: 85
      critical: 95

  memory:
    enabled: true
    interval: 30s
    timeout: 10s
    memoryThresholds:
      warning: 85
      critical: 95
    swapThresholds:
      warning: 50
      critical: 80
    oomDetection: true

  disk:
    enabled: true
    interval: 1m
    timeout: 30s
    paths:
      - path: "/"
        warningThreshold: 85
        criticalThreshold: 95
      - path: "/var/lib/kubelet"
        warningThreshold: 85
        criticalThreshold: 95
      - path: "/var/lib/docker"
        warningThreshold: 80
        criticalThreshold: 90
      - path: "/var/lib/containerd"
        warningThreshold: 80
        criticalThreshold: 90
    inodeThresholds:
      warning: 85
      critical: 95
    readOnlyDetection: true
    ioHealthCheck: true

  ipForwarding:
    enabled: true
    interval: 30s
    timeout: 5s
    checkIPv4: true
    checkIPv6: true
    checkPerInterface: false

  # IPv6 / dual-stack monitors (detection-only — never modify host settings).
  # These degrade gracefully on IPv4-only nodes: a missing IPv6 stack is
  # reported as a warning, not an error. On IPv4-only clusters set
  # expectIPv6Enabled: false (or enabled: false) to silence them entirely.

  # Checks disable_ipv6 sysctl — flags IPv6 disabled when it is expected on.
  ipv6Sysctl:
    enabled: true
    interval: 60s
    timeout: 5s
    expectIPv6Enabled: true
    checkPerInterface: false
    # procPath is always /host/proc inside the container (host fs is bind-mounted)
    procPath: /host/proc

  # Checks for a valid IPv6 default route — flags missing route when expected.
  ipv6Route:
    enabled: true
    interval: 60s
    timeout: 5s
    expectDefaultRoute: true
    procPath: /host/proc

  # Checks RA/SLAAC address presence (link-local/global) and accept_ra sysctl.
  ipv6Neighbor:
    enabled: true
    interval: 60s
    timeout: 5s
    expectIPv6Enabled: true
    checkPerInterface: true
    requireGlobalAddress: false
    procPath: /host/proc

  # Detection-only ip6tables/nftables listing — flags unexpected firewall state.
  ipv6Firewall:
    enabled: true
    interval: 60s
    timeout: 5s
    expectIPv6Enabled: true
    # backend: auto selects ip6tables or nftables based on what is present on the node
    backend: auto

# Exporters configuration
exporters:
  kubernetes:
    enabled: true
    updateInterval: 30s
    resyncInterval: 5m
    heartbeatInterval: 1m
    maxEventsPerMinute: 10
    eventTTL: 1h
    deduplicationWindow: 5m

  prometheus:
    enabled: true
    port: 9101
    path: /metrics
    namespace: node_doctor
    subsystem: monitor

  http:
    enabled: false
    # "::" = dual-stack (listens on IPv4 and IPv6); the server falls back to
    # "0.0.0.0" automatically if the host kernel has IPv6 disabled.
    bindAddress: "::"
    port: 8080
    tlsEnabled: false

# Remediation configuration
remediation:
  enabled: true
  dryRun: false
  maxRemediationsPerHour: 5
  maxRemediationsPerMinute: 1
  cooldownPeriod: 10m
  maxAttemptsGlobal: 2

# Features configuration
features:
  enableMetrics: true
  enableProfiling: false
  enableTracing: false

# Overlay test configuration for CNI connectivity testing
# Uses Go HTTP health server for accurate probing (fixes Cilium ICMP issue)
overlayTest:
  # Enable overlay test pods - required for accurate CNI connectivity testing
  enabled: true

  # Image for overlay test pods (Go HTTP health server, scratch-based ~6MB)
  image:
    repository: supporttools/node-doctor-overlay-test
    tag: "v1.0.0"
    pullPolicy: IfNotPresent

  # HTTP health probe port
  port: 8023

  # Resource limits for overlay test pods.
  # Do NOT lower the CPU limit back toward 10m. At 10m the pod sat 88-93% CFS-throttled
  # and inflated its own HTTP probe latency from ~3ms to 300-500ms, which node-doctor
  # then reported as peer/CNI latency and turned into false NetworkDegraded and
  # HighPeerLatency alerts. 100m leaves enough headroom that throttling stops.
  resources:
    requests:
      cpu: 5m
      memory: 8Mi
    limits:
      cpu: 100m
      memory: 16Mi

  # Update strategy
  updateStrategy:
    maxUnavailable: "25%"

  # Priority class (empty = no priority class)
  priorityClassName: ""

controller:
  # Enable the node-doctor controller (requires persistent storage)
  enabled: false

  # Container image for the controller
  image:
    repository: supporttools/node-doctor-controller
    pullPolicy: IfNotPresent
    # Defaults to chart appVersion when empty
    tag: ""

  # Service account for the controller
  serviceAccount:
    create: true
    annotations: {}
    name: ""

  # Service configuration
  service:
    type: ClusterIP
    port: 8080
    annotations: {}

  # Persistent storage for SQLite database
  persistence:
    enabled: true
    # Storage class - leave empty to use cluster default
    storageClassName: ""
    accessMode: ReadWriteOnce
    size: 1Gi
    annotations: {}

  # Resource requests and limits
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

  # Controller configuration
  config:
    server:
      port: 8080
      readTimeout: 30s
      writeTimeout: 30s
      enableCORS: false
    storage:
      path: /data/node-doctor.db
      retention: 720h
    correlation:
      enabled: true
      clusterWideThreshold: 0.3
      evaluationInterval: 30s
      minNodesForCorrelation: 2
    coordination:
      enabled: true
      maxConcurrentRemediations: 3
      defaultLeaseDuration: 5m
      cooldownPeriod: 10m
      # fallbackOnUnreachable: when true, agents proceed with remediations
      # if the controller is unreachable (e.g., during upgrades).
      # false = safer (blocks remediations if controller is down).
      # true  = higher availability (agents act independently when unreachable).
      #
      # WARNING - cluster-wide remediation storm risk:
      # Setting this to true defeats lease coordination during a controller
      # outage. When the controller is down, EVERY node self-approves its own
      # lease at the same time, so ALL nodes may remediate (reboot/drain/etc.)
      # simultaneously - a thundering-herd, cluster-wide remediation storm.
      # Lease coordination exists to serialize remediations (single node at a
      # time) and prevent exactly this. Keep this false unless single-node-at-a-
      # time coordination is not required and you explicitly want higher
      # availability over storm protection.
      fallbackOnUnreachable: false

  # Node affinity - prefer control-plane nodes
  preferControlPlane: true

  # Additional tolerations (control-plane tolerations always included)
  tolerations: []

  # Additional pod annotations (prometheus.io/scrape, /port, /path are managed by
  # the chart template — do not set them here; they will be overridden by the template)
  podAnnotations: {}

  # SecurityContext for the controller pod (non-root)
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65534
    fsGroup: 65534

  # SecurityContext for the controller container
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
